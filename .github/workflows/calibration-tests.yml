name: Calibration smoke tests
on:
  push:
    branches: [feature/windows-lsl-mvp]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  calibration:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install processing test dependencies
        run: python -m pip install numpy scipy
      - name: Compile Python project
        run: python -m compileall -q main.py simulate.py physiolab tests
      - name: Run synthetic calibration tests
        run: python -m unittest discover -s tests -v
