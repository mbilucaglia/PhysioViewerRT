name: Calibration smoke tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  architecture_quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned development tools
        run: python -m pip install -r requirements-dev.txt
      - name: Check execution errors
        run: python -m ruff check physiolab tests tests_gui tools main.py simulate.py
      - name: Check migrated boundary types
        run: python -m mypy

  windows_locked:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked application environment
        run: python -m pip install -r requirements-lock-windows-py312.txt
      - name: Check installed requirements
        run: python -m pip check
      - name: Run core and architecture tests
        run: python -m unittest discover -s tests -v
      - name: Run GUI lifecycle and integration tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests_gui -v

  calibration:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install processing test dependencies
        run: python -m pip install numpy scipy PySide6 -r requirements-affect.txt -r requirements-asr.txt
      - name: Compile Python project
        run: python -m compileall -q main.py simulate.py physiolab tests
      - name: Run synthetic calibration tests
        run: python -m unittest discover -s tests -v

  gui_smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install full Windows GUI dependencies
        run: python -m pip install -r requirements.txt
      - name: Install optional VisPy for real renderer construction test
        run: python -m pip install -r requirements-vispy.txt
      - name: Run offscreen stream and raw-plot interaction tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests_gui -v
